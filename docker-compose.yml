services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: wp
      POSTGRES_PASSWORD: wp
      POSTGRES_DB: workpaper
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wp"]
      interval: 5s
      retries: 10
volumes:
  pgdata: {}
