name: ci
on:
  push: { branches: [main] }
  pull_request:
concurrency: { group: ci-${{ github.ref }}, cancel-in-progress: true }
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env: { POSTGRES_USER: wp, POSTGRES_PASSWORD: wp, POSTGRES_DB: workpaper }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wp" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://wp:wp@localhost:5432/workpaper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run verify:packet
      - run: npm run verify:errors
      - run: npm test
      - run: npx drizzle-kit push --force
      - run: npx tsx scripts/import.ts --reset | tee import.log
      - run: grep -q "documents 74, pages 199, values 3012, lines 1877, checks 101" import.log
      - run: npx tsx scripts/demo-seed.ts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: test-results, retention-days: 7 }
